name: update-news

on:
  schedule:
    - cron: "0 */3 * * *"   # 3시간마다 (UTC 기준)
  workflow_dispatch:         # 수동 실행 버튼
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 번역 라이브러리 설치
        run: pip install deep-translator

      - name: 뉴스 페이지 생성
        run: |
          python world_news.py --translate --no-open
          mkdir -p site
          cp world_news.html site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
